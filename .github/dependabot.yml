version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The Charm libraries move together; one PR per week beats six.
      charm:
        patterns:
          - "github.com/charmbracelet/*"
      golang-x:
        patterns:
          - "golang.org/x/*"
    commit-message:
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # The browser UI's lockfile.
  - package-ecosystem: npm
    directory: /internal/web/_ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
      # @eslint/js has no peer range on eslint, so nothing would stop it being
      # taken to 10 while the engine stays at 9 and the config it exports is
      # then fed to a version that cannot read it.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
    ignore:
      # Held at 9: eslint-plugin-jsx-a11y has no release for 10, and the a11y
      # rules matter more here than the major does. Lift both together when it
      # ships one.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      # typescript-eslint declares typescript <6.1.0.
      - dependency-name: "typescript"
        versions: [">=6.1"]
    commit-message:
      prefix: "chore"

  # The docs site's pinned mkdocs-material.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    commit-message:
      prefix: "docs"
