name: Release

# Tags only. Both jobs are meaningless on a branch: goreleaser refuses to
# release an untagged commit, and the semver image tags would come out empty.
# Semver tags only. A non-numeric tag like "vnext" would make the semver image
# tags come out empty, and the image push then fails with no tag to push.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  goreleaser:
    name: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
