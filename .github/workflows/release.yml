name: Release

# Tags only: goreleaser refuses to release an untagged commit, so a push to a
# branch has nothing to do here.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  goreleaser:
    name: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
