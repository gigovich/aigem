name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify gofmt
        run: |
          # pipefail, or a find that cannot read a directory reports success and
          # the files under it are silently never checked.
          set -o pipefail
          unformatted=$(find . -path ./internal/web/_ui/node_modules -prune -o -name '*.go' -print | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Test
        run: go test -race -timeout 15m ./...

  # aigem builds for Windows but its hook runner shells out to bash, so the
  # suite is not meaningful there. Compile and vet instead of reporting a red
  # test run for an untested platform.
  build-windows:
    name: build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...

  # The browser UI is never committed built, so nothing in the Go jobs compiles
  # it and nothing in them fails when it breaks. This job is the only place that
  # notices. It runs unconditionally rather than behind a paths filter: a
  # path-filtered required check never reports on a PR that does not touch it.
  web:
    name: web ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/web/_ui/package-lock.json
      - name: Install
        run: npm ci
        working-directory: internal/web/_ui
      - name: Lint
        run: npm run lint
        working-directory: internal/web/_ui
      - name: Typecheck
        run: npm run check
        working-directory: internal/web/_ui
      - name: Test
        run: npm test
        working-directory: internal/web/_ui
      - name: Build
        run: npm run build
        working-directory: internal/web/_ui
      # The Go jobs never run npm, so HasAssets() is false in every one of them
      # and TestTheEmbeddedBundleIsServed - the only test that touches the real
      # //go:embed filesystem rather than a fake one - skips everywhere else.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Serve the embedded bundle
        run: go test -run TestTheEmbeddedBundleIsServed -v ./internal/web/
        env:
          # Without this the test skips - and a skip exits 0, so the job would
          # pass while proving nothing.
          AIGEM_REQUIRE_UI: "1"

  # Linted for both GOOS values: build-tagged files are invisible to a lint run
  # for the other platform, so the Windows-only sources would otherwise never be
  # checked anywhere.
  lint:
    name: lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.12

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build every released target
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "==> $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/aigem
          done

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  tidy:
    name: go mod tidy is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # -diff reports what tidy would change without writing, so this never
      # depends on the checkout being pristine.
      - run: go mod tidy -diff
