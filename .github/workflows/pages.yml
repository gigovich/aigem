name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  # Build (but do not deploy) on PRs, so a --strict break is caught before merge
  # rather than after. GitHub Actions does not support YAML anchors, so this
  # list is duplicated rather than shared.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keyed by ref: a single global "pages" group would make concurrent PR docs
# builds cancel one another, and queue a merge behind an in-flight PR build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      # --strict turns a broken internal link or a nav entry pointing at a
      # missing page into a failed build rather than a quietly broken site.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    # Never deploy from a pull request - it would publish unreviewed content.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # enablement:true turns Pages on for the repo, so the very first run does
      # not fail on a repo where Settings -> Pages was never touched.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
