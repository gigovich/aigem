version: 2

project_name: aigem

before:
  hooks:
    - go mod tidy

builds:
  - id: aigem
    main: ./cmd/aigem
    binary: aigem
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [aigem]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      - src: docs/*.md
        dst: docs

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  footer: |
    ---

    ### Install

    ```sh
    go install github.com/gigovich/aigem/cmd/aigem@{{ .Tag }}
    ```

    Or download a binary above, then verify it against `checksums.txt`.

    These binaries do not carry the browser UI: building it needs a Node
    toolchain, which the release pipeline deliberately does not depend on.
    `aigem web` will start and tell you so. To get one, build from a checkout
    with `make web && make build`.
